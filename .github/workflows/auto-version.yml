name: TOP Design · Auto version
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  bump:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[skip version]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bump app version and cache key
        run: node scripts/bump-version.mjs
      - name: Commit version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json version.js sw.js index.html manifest.webmanifest
          git diff --cached --quiet && exit 0
          git commit -m "chore: auto version [skip version]"
          git push
